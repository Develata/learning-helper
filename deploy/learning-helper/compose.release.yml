name: learning-helper
services:
  learning-helper:
    image: ${LEARNING_HELPER_IMAGE:-ghcr.io/develata/learning-helper:0.2.1}
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:${LEARNING_HELPER_PORT:-3010}:3001"
    environment:
      LEARNING_HELPER_PORT: "${LEARNING_HELPER_PORT:-3010}"
    volumes:
      - learning-data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/opt/learning-helper/health.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  learning-data:
